[project]
name = "tokenlab"
version = "0.2.5"
description = "Token map: where Claude Code tokens go and which should not be there"
license = "MIT"
authors = [
    { name = "Mert Türker" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tokenlab = "tokenlab.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8,<0.17",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
